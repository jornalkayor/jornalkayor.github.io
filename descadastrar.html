.grid,.newsletter-editor-grid{grid-template-columns:minmax(0,1fr);gap:12px}.section-banner{flex-direction:column;align-items:stretch}.overview-actions,.row{gap:8px}.overview-actions .btn,.row .btn{min-height:44px}

<body><main class="card"><div class="brand">KAYOR · NEWSLETTER</div><h1>Gerenciar inscrição</h1><p>Você pode cancelar o recebimento da newsletter do Kayor usando este link.</p><button id="unsubscribe" type="button">Cancelar minha inscrição</button><div id="msg" role="status" aria-live="polite"></div><p><a href="/" style="color:var(--blue)">Voltar ao Kayor</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const db=window.supabase.createClient("https://fcgjtxfrgezbxfdxtouf.supabase.co","sb_publishable_edom7QrsN88KKo8JdwpP5w_ef22VbSv");const btn=document.getElementById("unsubscribe"),msg=document.getElementById("msg"),token=new URLSearchParams(location.search).get("token");if(!token||!/^[0-9a-f-]{36}$/i.test(token)){btn.disabled=true;msg.textContent="O link está incompleto ou inválido. Use o link de descadastro que recebeu ao se inscrever."}btn.addEventListener("click",async()=>{if(!token)return;btn.disabled=true;btn.textContent="Processando…";const {data,error}=await db.functions.invoke("kayor-newsletter-unsubscribe",{body:{token}});if(error||!data?.success){msg.textContent=data?.error||"Não foi possível cancelar agora. Tente novamente mais tarde.";btn.disabled=false;btn.textContent="Tentar novamente";return}if(data.alreadyUnsubscribed){msg.textContent="Esta inscrição já estava cancelada. Você não receberá futuras edições da newsletter.";btn.textContent="Inscrição já cancelada"}else{msg.textContent="Sua inscrição foi cancelada. Você não receberá futuras edições da newsletter.";btn.textContent="Inscrição cancelada"}});
</script></body></html>
